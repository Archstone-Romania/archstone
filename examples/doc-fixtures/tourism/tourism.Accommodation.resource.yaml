# Doc fixture (#57) — matches docs/ONBOARDING.md Step 3's `tourism.Accommodation.resource.yaml`
# verbatim. The doc's Step 2 capability snippet references `collection: Accommodation`; this
# is the file that reference must resolve against, or `archstone apply` fails closed with
# `unknown-resource`.
resource:
  name: tourism.Accommodation
  description: A bookable place to stay matching a traveler's search.
  fields:
    name:
      type: text
      description: The property's display name.
    location:
      type: location
      description: Where the stay is — city, region, or address.
    pricePerNight:
      type: quantity
      description: Nightly rate for the stay.
    rating:
      type: quantity
      required: false
      description: Guest review score, when available.
