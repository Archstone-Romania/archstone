# Implementation binding — how tourism.search reaches the backend. NOT CDL.
binding:
  capabilityId: tourism.search
  connector:
    type: rest
    rest:
      baseUrl: "${STAYS_API_URL}"
      method: POST
      path: /v1/search

  # Provider body → Stay resource (ADD-12). The resource is the anchor; these JSONPaths
  # are the only thing that moves if the backend renames a field. Required fields (name,
  # location, pricePerNight) missing → contract VIOLATION; the optional ones → DEGRADED.
  #
  # Note what is NOT here. The backend also returns `boardType`, `freeCancellationUntil`,
  # `roomDescription`, `net` and `commission` — the vocabulary Amadeus Hotel Search v3 and
  # Hotelbeds actually return, wholesale rate and agency cut included. None are mapped, so
  # none reach the model (ADR-0008). Nothing here has to change to keep them out: leaving a
  # field unnamed IS the control. Adopting the useful ones is a deliberate act, not a default.
  response:
    collection: "$.stays[*]"
    resource: Stay
    map:
      name: "$.name"
      location: "$.location"
      pricePerNight: "$.pricePerNight"
      rating: "$.rating"

  # Extract (per the accepted architecture decision extending ADD-12): `totalMatches` is a
  # capability-level SCALAR, not part of any one Stay — it has no resource to anchor it, so it
  # cannot go through `response:`. `extract:` reaches it directly off the raw body root,
  # alongside the `stays` collection `response:` already maps.
  extract:
    totalMatches: "$.totalMatches"

  # What we last verified the mock backend returns (ADD-18). `archstone verify` replays
  # fixtures/tourism.search.golden.json's `request` live and compares the response shape.
  contract:
    source: recorded
    # Re-recorded for the `totalMatches` addition above ($.totalMatches: number joins the
    # shape) — every other path/type is unchanged, so this is purely additive drift.
    fingerprint: "sha256:f5475f16fbc6d9f151b8cb565dfbe1243633929816aabdacdd40ec45bb89d241"
    # Recorded response shape — paths and types, never values (ADD-114). This is what lets
    # `archstone verify` name a field the backend gained, instead of only reporting a moved hash.
    # Note what is here and unmapped: `net` and `commission` are recorded as SHAPE, so drift in
    # them is still detected — and still never forwarded to a model (ADR-0008).
    shape:
      "$": object
      "$.stays": array
      "$.stays[]": object
      "$.stays[].boardType": string
      "$.stays[].commission": number
      "$.stays[].freeCancellationUntil": string
      "$.stays[].id": string
      "$.stays[].location": string
      "$.stays[].name": string
      "$.stays[].net": number
      "$.stays[].pricePerNight": number
      "$.stays[].rating": number
      "$.stays[].roomDescription": string
      "$.totalMatches": number
    verifiedAt: "2026-09-11T00:00:00Z"
    probe:
      fixture: fixtures/tourism.search.golden.json
