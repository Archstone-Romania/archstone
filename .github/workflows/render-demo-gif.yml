# Re-render the launch GIF in `docs/init.gif` from `examples/demo/init.tape`.
#
# WHAT THIS GUARANTEES, AND WHAT IT DOES NOT.
#
# A GIF cannot be regenerated byte-for-byte — frame timing and encoding vary between runs — so
# there is no "fails if it drifted" check to write, and this job deliberately does not pretend
# otherwise. What it does guarantee is that the recorded scenario still *runs*: the tape drives
# the real CLI, and the step after it asserts the manifest that run produced compiles.
#
# The failure this cannot catch is a DESYNC. The tape's answers are positional — Enters and
# words fed to whatever the gate asks, in order. Reorder a prompt and the GIF still renders, it
# just records something wrong. Nothing here will fail. A human has to look at the artifact,
# which is why this uploads it and does not commit it: a person opens the artifact, checks it,
# and commits it deliberately.
name: Render demo GIF

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # The compile path the tape walks, asserted independently of the recording. This is the
      # same spec and the same comparison `packages/init/test/second-oracle.test.ts` makes; it
      # runs here too so a broken demo fails the job rather than only the suite.
      - name: The recorded scenario still compiles
        run: |
          cat > /tmp/decisions.json <<'JSON'
          { "version": "0",
            "company": { "id": "wanderlust", "name": "Wanderlust Travel" },
            "decisions": [ { "operation": "POST /v1/search", "keep": true,
                             "capabilityId": "tourism.search", "effect": "read" } ] }
          JSON
          node packages/cli/dist/index.js init examples/demo/stays-openapi.yaml \
            --out /tmp/wanderlust --decisions /tmp/decisions.json --non-interactive
          node packages/cli/dist/index.js apply /tmp/wanderlust

      # The tape's paths are repository-root relative for exactly this reason: the action runs
      # vhs from the checkout root, and a tape that only worked from a subdirectory would drift
      # away from the workflow that renders it.
      - uses: charmbracelet/vhs-action@v2
        with:
          path: examples/demo/init.tape

      - name: Upload for a human to look at
        uses: actions/upload-artifact@v4
        with:
          name: init-gif
          path: docs/init.gif
          if-no-files-found: error
