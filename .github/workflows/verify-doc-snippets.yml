name: Verify published doc snippets

# #57 — published CDL is a de facto second specification of the language (Rule #11: a
# shipped primitive is permanent, so a wrong published example is as load-bearing as the real
# grammar). #29 widened the same idea to every published package README, where a wrong
# TypeScript snippet is worse: it can only be corrected by cutting a new npm release, not by
# merging a PR. This runs whenever a PR touches one of the three top-level docs a copy-pasted
# CDL snippet is most likely to live/rot in, a package/provider README, the fixture-directory
# mechanism that completes CDL snippets into compilable manifests, or the checker itself — and
# fails the check if any covered snippet no longer compiles or no longer matches its package's
# real exports.
#
# Same check also runs unconditionally as part of `pnpm test` (scripts/verify-doc-snippets.
# test.ts) and again, explicitly, in release.yml's Build gate step before every tagged
# release — this workflow is the fast, PR-scoped signal so a doc-only PR doesn't have to wait
# for a release to find out it broke.

on:
  pull_request:
    paths:
      - "README.md"
      - "CASE-STUDY.md"
      - "docs/ONBOARDING.md"
      - "packages/*/README.md"
      - "providers/*/README.md"
      - "examples/doc-fixtures/**"
      - "scripts/verify-doc-snippets.mjs"

permissions:
  contents: read

concurrency:
  group: verify-doc-snippets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.1       # matches release.yml — no packageManager field at repo root to infer from
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify CDL and package README snippets in the published docs
        run: node scripts/verify-doc-snippets.mjs
