name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The repo-root release tooling uses Node's built-in runner, outside the Vitest workspace,
      # so `pnpm test` does not reach it. Before this ran on PRs, a broken release list or a
      # misnamed changelog.d fragment was first caught by release.yml, after the tag existed.
      - name: Release script tests
        run: node --test scripts/*.test.mjs
