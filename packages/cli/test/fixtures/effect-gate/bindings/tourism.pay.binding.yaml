# An `irreversible` capability that records a contract. Replaying this fixture on every CI run
# is the concrete harm #124 names: a real charge, repeated, against whatever ${STAYS_API_URL}
# happens to resolve to in that environment. See tourism.hold.binding.yaml on the fingerprint.
binding:
  capabilityId: tourism.pay
  connector:
    type: rest
    rest:
      baseUrl: "${STAYS_API_URL}"
      method: POST
      path: /v1/payments

  contract:
    source: recorded
    fingerprint: "sha256:deaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddeaddead"
    verifiedAt: "2026-08-25T00:00:00Z"
    probe:
      fixture: fixtures/tourism.pay.golden.json
